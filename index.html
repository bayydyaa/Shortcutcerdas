<title>Shortcut Cerdas</title>
<style>
:root{color-scheme:dark;--bg:#090e1c;--panel:rgba(22,30,52,.72);--panel2:rgba(255,255,255,.065);--line:rgba(255,255,255,.10);--text:#f4f6ff;--muted:#929bb5;--accent:#9aabff;--accent2:#c1a4ff;--shadow:0 24px 80px #0005}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;background:radial-gradient(ellipse at 50% -20%,#26345d 0,transparent 48%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);overflow-x:hidden}.ambient{position:fixed;filter:blur(90px);opacity:.18;pointer-events:none;border-radius:50%;z-index:-1}.a1{width:300px;height:300px;background:#697dff;top:35%;left:-180px}.a2{width:300px;height:300px;background:#b47bff;right:-180px;top:10%}.shell{width:min(980px,calc(100% - 36px));margin:auto;padding:calc(28px + env(safe-area-inset-top,0px)) 0 calc(22px + env(safe-area-inset-bottom,0px))}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:40px;height:40px;border-radius:14px;background:linear-gradient(140deg,#8ca1ff,#bd91ff);display:grid;place-items:center;color:#10152a;font-size:22px;font-weight:850;box-shadow:0 8px 25px #8296ff44}.brandname{font-size:19px;font-weight:750;letter-spacing:-.7px}.brandname span{color:#aab7ff}.tiny{font-size:9px;letter-spacing:2px;margin-top:2px}.muted,.date{color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);width:39px;height:39px;border-radius:50%;font-size:19px;cursor:pointer}.hero{text-align:center;padding:78px 0 64px}.eyebrow{font-size:10px;letter-spacing:2.6px;font-weight:750;color:#aebaff}.clock{font-size:clamp(64px,12vw,100px);font-weight:650;letter-spacing:-7px;line-height:1.05;margin:10px 0 7px;font-variant-numeric:tabular-nums}.date{font-size:14px}.search-wrap{width:min(620px,100%);margin:32px auto 0;padding:7px 8px 7px 18px;border:1px solid var(--line);background:rgba(255,255,255,.075);border-radius:18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.search-icon{font-size:27px;color:#aebaff;transform:rotate(-20deg)}#search{min-width:0;flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}#search::-webkit-search-cancel-button{display:none}#search::placeholder{color:#929bb5}.search-wrap button,.save-btn{border:0;border-radius:12px;padding:11px 17px;background:linear-gradient(135deg,#a9b8ff,#c5a5ff);color:#171b32;font-weight:750;cursor:pointer}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}h1{font-size:25px;letter-spacing:-.8px;margin:7px 0 0}.add-btn{border:1px solid #aab8ff55;background:#aab8ff16;color:#dce2ff;border-radius:13px;padding:11px 15px;font-weight:650;cursor:pointer}.add-btn span{font-size:18px;margin-right:4px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.tile{position:relative;min-height:142px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border-radius:21px;transition:transform .2s,border-color .2s,background .2s;backdrop-filter:blur(14px);overflow:hidden}.tile-link{display:block;height:100%;padding:19px 12px 14px;text-align:center;text-decoration:none;color:var(--text);border-radius:inherit}.tile-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.tile:hover{transform:translateY(-4px);border-color:#aab8ff88;background:#aab8ff12}.tile-icon{position:relative;width:53px;height:53px;margin:0 auto 12px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,hsl(var(--h,230) 75% 68%),hsl(calc(var(--h,230) + 40) 70% 58%));overflow:hidden;flex:none}.tile-icon .letter{font-size:24px;font-weight:800;color:#fff;text-shadow:0 1px 3px #0003}.tile-icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:9px;background:#fff;opacity:0;transition:opacity .2s}.tile-icon.has-img img{opacity:1}.tile-icon.has-img .letter{visibility:hidden}.tile-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile-domain{font-size:10px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edit-hint{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;border-radius:50%;background:#fff1;color:#dfe4ff;opacity:0;cursor:pointer;font-size:12px;letter-spacing:-1px}.tile:hover .edit-hint,.edit-hint:focus-visible{opacity:1}@media (hover:none){.edit-hint{opacity:.75}.tile:hover{transform:none}}.empty{text-align:center;padding:45px 12px;color:var(--muted)}.empty-icon{font-size:38px;color:#aab8ff}.empty h2{color:var(--text);font-size:18px}.empty p{font-size:13px}footer{display:flex;justify-content:space-between;align-items:center;margin-top:45px;padding-top:17px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.text-btn{background:none;border:0;color:#b9c4ff;font:inherit;margin-left:13px;cursor:pointer}.modal{width:min(440px,calc(100vw - 30px));padding:24px;background:#151d33;color:var(--text);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}dialog{padding:0;border:0;background:transparent;max-width:none;max-height:none}dialog::backdrop{background:#030611bd;backdrop-filter:blur(8px)}.modal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.modal h2{font-size:22px;margin:7px 0 0}.close{font-size:24px}.modal label{display:block;font-size:12px;color:#c3cbe2;margin:13px 0}.opt{color:var(--muted)}.field-error{margin:-6px 0 6px;font-size:12px;color:#ff9b9b}.icon-preview{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}.icon-preview:empty{display:none}.icon-preview .tile-icon{margin:0;width:44px;height:44px;border-radius:14px}.icon-preview .letter{font-size:20px}.modal input{display:block;width:100%;margin-top:7px;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:#0d1426;color:var(--text);outline:none;font:inherit;font-size:16px}.modal input:focus{border-color:#aab8ff}.modal input[aria-invalid=true]{border-color:#ff8a8a}.modal-actions{display:flex;align-items:center;gap:9px;margin-top:23px}.modal-actions span{flex:1}.cancel-btn,.delete-btn{padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}.delete-btn{color:#ff9b9b;border-color:#ff777744}.hidden{display:none!important}.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#e4e8ff;color:#151a30;padding:11px 17px;border-radius:99px;font-size:12px;font-weight:700;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
body.light{color-scheme:light;--bg:#f2f4fb;--panel:rgba(255,255,255,.8);--panel2:rgba(255,255,255,.75);--line:rgba(30,42,75,.12);--text:#202640;--muted:#707a94;background:radial-gradient(ellipse at 50% -20%,#dce3ff 0,transparent 55%),var(--bg)}body.light .tile{background:rgba(255,255,255,.75)}body.light .search-wrap{background:#ffffffb8}body.light .edit-hint{background:#20264014;color:#202640}body.light .tile-icon img{box-shadow:inset 0 0 0 1px #0001}body.light .modal{background:#fff;color:#202640}body.light .modal input{background:#f5f6fc;color:#202640}
@media(max-width:700px){.shell{width:calc(100% - 28px);padding-top:18px}.hero{padding:65px 0 52px}.clock{letter-spacing:-4px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{min-height:128px;padding:16px 8px 12px;border-radius:18px}.tile-icon{width:48px;height:48px;font-size:24px}.tile-name{font-size:12px}.section-head{align-items:center}h1{font-size:22px}.add-btn{padding:10px 11px;font-size:12px}.search-wrap{padding-left:13px}.search-wrap button{padding:10px 12px}.search-icon{font-size:23px}footer{margin-top:32px}}@media(max-width:370px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.clock{font-size:62px}}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{font-family:inherit}@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body.light .add-btn{color:#3a47a8;border-color:#5a6cd855;background:#5a6cd812}body.light .text-btn{color:#4a58c0}body.light .eyebrow,body.light .brandname span{color:#5a6cd8}body.light .search-icon{color:#5a6cd8}
.tile-name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25;word-break:break-word}

/* ===== v3: rapikan tablet, laptop, HP ===== */
.hero{padding:clamp(28px,8vh,78px) 0 clamp(28px,7vh,64px)}
.clock{font-size:clamp(56px,min(12vw,14vh),104px)}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.edit-hint{display:grid;place-items:center;padding:0;letter-spacing:0}
.edit-hint svg{fill:currentColor}
.tile-icon img{padding:5px}
.tile-domain .warn,.icon-preview .warn{color:#ff9b9b}
.tile.is-missing{border-color:#ff777755}
.tile.is-missing .tile-icon{filter:grayscale(1);opacity:.6}
.brandname span{color:#aab7ff}
@media(max-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:clamp(24px,6vh,56px) 0 clamp(24px,5vh,44px)}}
@media(max-width:370px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:701px) and (max-height:820px) and (orientation:landscape){.hero{padding:20px 0 28px}.search-wrap{margin-top:22px}.section-head{margin-bottom:16px}footer{margin-top:28px}}
.section-head{align-items:center}
.clock{font-size:clamp(56px,min(16vw,14vh),104px)}

</style>
</head>
<body>
<div class="ambient a1"></div><div class="ambient a2"></div>
<main class="shell">
  <header class="top">
    <div class="brand"><div class="brandmark">S</div><div><div class="brandname">Shortcut<span> Cerdas</span></div><div class="muted tiny">PUNYA BAYYU</div></div></div>
    <button class="icon-btn" id="themeBtn" type="button" title="Ganti tema" aria-label="Ganti tema">☼</button>
  </header>

  <section class="hero">
    <div class="eyebrow" id="greeting">SELAMAT DATANG</div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date">Memuat tanggal…</div>
    <form class="search-wrap" id="searchForm" role="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search" type="search" autocomplete="off" enterkeyhint="go" placeholder="Cari di Google atau ketik alamat web" aria-label="Cari di Google atau ketik alamat web">
      <button type="submit">Cari</button>
    </form>
  </section>

  <section class="section-head">
    <h1>Shortcut kamu</h1>
    <button class="add-btn" id="addBtn" type="button"><span>＋</span> Tambah</button>
  </section>

  <section class="grid" id="grid"></section>
  <section class="empty hidden" id="empty">
    <div class="empty-icon">✳</div>
    <h2>Belum ada shortcut</h2>
    <p>Tempel alamat web, logonya nanti muncul sendiri.</p>
    <button class="add-btn" id="emptyAdd" type="button">＋ Tambah shortcut</button>
  </section>

  <footer>
    <span>Made for Bayyu ✦</span>
    <div>
      <button class="text-btn" id="exportBtn" type="button">Cadangkan</button>
      <button class="text-btn" id="importBtn" type="button">Pulihkan</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </footer>
</main>

<dialog id="linkDialog">
  <form id="linkForm" class="modal" novalidate>
    <div class="modal-head">
      <h2 id="modalTitle">Tambah shortcut</h2>
      <button class="icon-btn close" type="button" id="closeBtn" aria-label="Tutup">×</button>
    </div>
    <label>Alamat web
      <input id="linkUrl" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="contoh: bayydyaa.github.io/kasircerdas">
    </label>
    <p class="field-error hidden" id="urlError">Alamat web belum benar. Contoh: kasir.com atau https://kasir.com</p>
    <label>Nama <span class="opt">(boleh kosong, diisi otomatis)</span>
      <input id="linkName" maxlength="40" placeholder="Kasir Cerdas">
    </label>
    <div class="icon-preview" id="iconPreview"></div>
    <input type="hidden" id="linkId">
    <div class="modal-actions">
      <button type="button" class="delete-btn hidden" id="deleteBtn">Hapus</button>
      <span></span>
      <button type="button" class="cancel-btn" id="cancelBtn">Batal</button>
      <button type="submit" class="save-btn">Simpan</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== Bayyu Dashboard ===== */

// Daftar awal (muncul saat dashboard pertama kali dibuka di sebuah perangkat).
// Kalau alamatnya beda, ganti di sini sebelum upload ke GitHub.
const DEFAULTS = [
  { name: "Pasar Tani Cerdas", url: "https://bayydyaa.github.io/pasartanicerdas/" },
  { name: "Pertanian Cerdas",  url: "https://bayydyaa.github.io/pertaniancerdas/" },
  { name: "Kasir Cerdas",      url: "https://bayydyaa.github.io/kasircerdas/" },
  { name: "Kamera Cerdas",     url: "https://bayydyaa.github.io/kameracerdas/" }
];

const KEY = "bayyu-dashboard-links-v2";
const THEME = "bayyu-dashboard-theme";
const $ = id => document.getElementById(id);

/* ---------- utilitas ---------- */
const uid = () => (window.crypto && crypto.randomUUID)
  ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2);

function readLS(k) { try { return localStorage.getItem(k); } catch { return null; } }
function writeLS(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Hanya terima alamat http/https. Tanpa "https://" otomatis ditambahkan.
function cleanUrl(raw) {
  let s = String(raw || "").trim();
  if (!s) return null;
  if (!/^[a-z][a-z\d+.-]*:\/\//i.test(s)) {
    if (/^[a-z][a-z\d+.-]*:/i.test(s) && !/^[\w-]+(\.[\w-]+)+:\d+/i.test(s)) return null; // tolak javascript:, data:, dll
    s = "https://" + s;
  }
  try {
    const u = new URL(s);
    if (u.protocol !== "http:" && u.protocol !== "https:") return null;
    if (!u.hostname.includes(".") && u.hostname !== "localhost") return null;
    return u.href;
  } catch { return null; }
}

function safeIcon(s) {
  if (typeof s !== "string" || !s) return "";
  if (s.startsWith("data:image/")) return s.length < 150000 ? s : "";
  try { const u = new URL(s); return (u.protocol === "https:" || u.protocol === "http:") ? u.href : ""; }
  catch { return ""; }
}

function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; } }

function nameFromUrl(url) {
  try {
    const u = new URL(url);
    const seg = u.pathname.split("/").filter(Boolean)[0];
    if (u.hostname.endsWith("github.io") && seg) return decodeURIComponent(seg);
    const sld = ["ac", "co", "go", "or", "my", "sch", "web", "net", "com", "org", "gov", "edu", "id", "biz"];
    const h = hostOf(url).split(".");
    if (h.length > 1) h.pop();
    while (h.length > 1 && sld.includes(h[h.length - 1])) h.pop();
    const n = h[h.length - 1] || "Shortcut";
    return n.charAt(0).toUpperCase() + n.slice(1);
  } catch { return "Shortcut"; }
}

function subLabel(url) {
  try {
    const u = new URL(url);
    const seg = u.pathname.split("/").filter(Boolean)[0];
    if (u.hostname.endsWith("github.io") && seg) return "github.io/" + decodeURIComponent(seg);
  } catch {}
  return hostOf(url);
}

function initial(name) { return (String(name).trim().match(/[\p{L}\p{N}]/u) || ["•"])[0].toUpperCase(); }

function hue(str) { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

/* ---------- data ---------- */
function sanitize(arr) {
  return arr.map(x => {
    const url = cleanUrl(x && x.url);
    if (!url) return null;
    return {
      id: String(x.id || uid()),
      name: String(x.name || nameFromUrl(url)).trim().slice(0, 40) || nameFromUrl(url),
      url,
      icon: safeIcon(x.icon),
      autoName: !!x.autoName,
      checked: !!x.checked,
      checkedAt: Number(x.checkedAt) || 0,
      missing: !!x.missing
    };
  }).filter(Boolean);
}

function load() {
  try {
    const saved = JSON.parse(readLS(KEY));
    if (Array.isArray(saved)) return sanitize(saved);
  } catch {}
  return sanitize(DEFAULTS);
}

let links = load();
let warnedStorage = false;
function save() {
  if (!writeLS(KEY, JSON.stringify(links)) && !warnedStorage) {
    warnedStorage = true;
    toast("Browser ini tidak bisa menyimpan data (mode privat?)");
  }
}

/* ---------- cari logo otomatis ---------- */
function googleIcon(url) {
  return "https://www.google.com/s2/favicons?sz=128&domain_url=" + encodeURIComponent(new URL(url).origin);
}

async function fetchWithTimeout(url, ms = 7000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { signal: ctrl.signal, cache: "no-store", credentials: "omit" }); }
  finally { clearTimeout(t); }
}

async function manifestIcon(manifestUrl) {
  try {
    const r = await fetchWithTimeout(manifestUrl);
    if (!r.ok) return "";
    const m = await r.json();
    const icons = Array.isArray(m.icons) ? m.icons : [];
    const size = i => Math.max(0, ...String(i.sizes || "0").split(/\s+/).map(s => parseInt(s, 10) || (s === "any" ? 999 : 0)));
    const best = icons.filter(i => i && i.src && !/maskable/.test(i.purpose || "") || icons.length === 1)
                      .sort((a, b) => size(b) - size(a))[0];
    return best ? new URL(best.src, r.url || manifestUrl).href : "";
  } catch { return ""; }
}

// Coba baca halaman web-nya langsung (berhasil untuk GitHub Pages),
// kalau gagal pakai layanan logo Google.
async function findIcon(url) {
  const isGithub = /\.github\.io$/i.test(new URL(url).hostname);
  let title = "", icon = "", missing = false;
  try {
    const r = await fetchWithTimeout(url);
    if (r.status === 404) missing = true;
    if (r.ok && /html/i.test(r.headers.get("content-type") || "html")) {
      const doc = new DOMParser().parseFromString(await r.text(), "text/html");
      const base = r.url || url;
      title = (doc.querySelector("title")?.textContent || "").replace(/\s+/g, " ").trim();
      const link = doc.querySelector('link[rel~="apple-touch-icon"]')
        || doc.querySelector('link[rel~="icon"][type="image/svg+xml"]')
        || doc.querySelector('link[rel~="icon"]');
      const href = link && link.getAttribute("href");
      if (href) icon = href.startsWith("data:image/") ? href : new URL(href, base).href;
      if (!icon) {
        const fav = new URL("favicon.ico", base).href;
        try { const f = await fetchWithTimeout(fav, 4000); if (f.ok && /image/i.test(f.headers.get("content-type") || "")) icon = fav; } catch {}
      }
      if (!icon) {
        const mf = doc.querySelector('link[rel="manifest"]')?.getAttribute("href");
        if (mf) icon = await manifestIcon(new URL(mf, base).href);
      }
    }
  } catch {}
  icon = safeIcon(icon);
  // GitHub Pages tanpa logo: pakai huruf awal (logo Google-nya cuma logo GitHub)
  if (!icon && !isGithub && !missing) icon = googleIcon(url);
  return { icon, title: title.slice(0, 40), missing };
}

const pending = new Set();
async function refreshIcon(id) {
  if (pending.has(id)) return;
  const item = links.find(x => x.id === id);
  if (!item) return;
  pending.add(id);
  const { icon, title, missing } = await findIcon(item.url);
  pending.delete(id);
  const cur = links.find(x => x.id === id);
  if (!cur || cur.url !== item.url) return; // sudah diedit/dihapus
  cur.icon = icon;
  cur.missing = missing;
  cur.checked = true;
  cur.checkedAt = Date.now();
  if (cur.autoName && title) { cur.name = title; cur.autoName = false; }
  save();
  render();
}

async function checkMissingIcons() {
  // Cek ulang yang belum punya logo / link 404 sekali sehari, biar ikut berubah kalau web-nya diperbaiki
  const DAY = 864e5;
  const stale = l => !l.checked || ((!l.icon || l.missing) && Date.now() - (l.checkedAt || 0) > DAY);
  for (const x of links.filter(stale)) await refreshIcon(x.id);
}

/* ---------- tampilan ---------- */
function iconHTML(x) {
  return `<div class="tile-icon" style="--h:${hue(x.url)}"><span class="letter">${esc(initial(x.name))}</span>${
    x.icon ? `<img src="${esc(x.icon)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : ""}</div>`;
}

function wireImages(root) {
  root.querySelectorAll(".tile-icon img").forEach(img => {
    const box = img.parentElement;
    const ok = () => { if (img.naturalWidth > 1) box.classList.add("has-img"); else img.remove(); };
    img.onerror = () => img.remove();
    img.onload = ok;
    if (img.complete) img.naturalWidth ? ok() : img.remove();
  });
}

function render() {
  $("grid").innerHTML = links.map(x => `
    <div class="tile${x.missing ? " is-missing" : ""}">
      <a class="tile-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">
        ${iconHTML(x)}
        <div class="tile-name">${esc(x.name)}</div>
        <div class="tile-domain">${x.missing ? '<span class="warn">Link 404, cek alamat</span>' : esc(subLabel(x.url))}</div>
      </a>
      <button class="edit-hint" type="button" data-edit="${esc(x.id)}" aria-label="Edit ${esc(x.name)}"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>`).join("");
  $("grid").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openEdit(b.dataset.edit));
  wireImages($("grid"));
  $("empty").classList.toggle("hidden", links.length !== 0);
  $("grid").classList.toggle("hidden", links.length === 0);
}

/* ---------- dialog tambah / edit ---------- */
function showUrlError(show) {
  $("urlError").classList.toggle("hidden", !show);
  $("linkUrl").setAttribute("aria-invalid", show ? "true" : "false");
}

function openAdd() {
  $("linkForm").reset();
  $("linkId").value = "";
  $("modalTitle").textContent = "Tambah shortcut";
  $("deleteBtn").classList.add("hidden");
  $("iconPreview").innerHTML = "";
  showUrlError(false);
  $("linkDialog").showModal();
  setTimeout(() => $("linkUrl").focus(), 50);
}

function openEdit(id) {
  const x = links.find(v => v.id === id);
  if (!x) return;
  $("linkId").value = id;
  $("linkUrl").value = x.url;
  $("linkName").value = x.autoName ? "" : x.name;
  $("modalTitle").textContent = "Edit shortcut";
  $("deleteBtn").classList.remove("hidden");
  $("iconPreview").innerHTML = iconHTML(x) + (x.missing
    ? `<span class="warn">Alamat ini tidak ditemukan (404). Cek lagi nama repo-nya, huruf besar-kecil juga berpengaruh.</span>`
    : `<span>Logo dicek ulang otomatis waktu kamu simpan.</span>`);
  wireImages($("iconPreview"));
  showUrlError(false);
  $("linkDialog").showModal();
}

function closeDialog() { $("linkDialog").close(); }

$("addBtn").onclick = openAdd;
$("emptyAdd").onclick = openAdd;
$("closeBtn").onclick = closeDialog;
$("cancelBtn").onclick = closeDialog;
$("linkDialog").addEventListener("click", e => { if (e.target === $("linkDialog")) closeDialog(); });
$("linkUrl").addEventListener("input", () => showUrlError(false));

$("linkForm").addEventListener("submit", e => {
  e.preventDefault();
  const url = cleanUrl($("linkUrl").value);
  if (!url) { showUrlError(true); $("linkUrl").focus(); return; }
  const typedName = $("linkName").value.trim();
  const id = $("linkId").value;
  const old = links.find(x => x.id === id);
  const item = {
    id: id || uid(),
    url,
    name: typedName || (old && !old.autoName && old.url === url ? old.name : nameFromUrl(url)),
    autoName: !typedName && !(old && !old.autoName && old.url === url),
    icon: old && old.url === url ? old.icon : "",
    missing: false,
    checked: false,
    checkedAt: 0
  };
  if (old) links = links.map(x => x.id === id ? item : x);
  else links.push(item);
  save();
  render();
  closeDialog();
  toast(old ? "Shortcut disimpan" : "Shortcut ditambahkan");
  refreshIcon(item.id);
});

$("deleteBtn").onclick = () => {
  const id = $("linkId").value;
  const x = links.find(v => v.id === id);
  if (!x || !confirm(`Hapus "${x.name}"?`)) return;
  links = links.filter(v => v.id !== id);
  save();
  render();
  closeDialog();
  toast("Shortcut dihapus");
};

/* ---------- pencarian ---------- */
$("searchForm").onsubmit = e => {
  e.preventDefault();
  const q = $("search").value.trim();
  if (!q) return;
  const looksUrl = !/\s/.test(q) && /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(q);
  const url = looksUrl ? cleanUrl(q) : null;
  location.href = url || "https://www.google.com/search?q=" + encodeURIComponent(q);
};

/* ---------- tema ---------- */
function applyTheme(t) {
  document.body.classList.toggle("light", t === "light");
  $("themeBtn").textContent = t === "light" ? "☾" : "☼";
  document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f2f4fb" : "#0b1020";
}
applyTheme(readLS(THEME) || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
$("themeBtn").onclick = () => {
  const t = document.body.classList.contains("light") ? "dark" : "light";
  applyTheme(t);
  writeLS(THEME, t);
};

/* ---------- cadangkan / pulihkan ---------- */
$("exportBtn").onclick = () => {
  const data = links.map(({ name, url, icon }) => ({ name, url, icon }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "shortcut-cerdas-cadangan.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Cadangan diunduh");
};

$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    const clean = sanitize(data.map(x => ({ ...x, id: undefined, checked: false })));
    if (!clean.length) throw 0;
    if (!confirm(`Ganti shortcut sekarang dengan ${clean.length} shortcut dari cadangan?`)) return;
    links = clean;
    save();
    render();
    toast("Shortcut dipulihkan");
    checkMissingIcons();
  } catch {
    alert("File ini bukan cadangan Shortcut Cerdas. Pilih file .json hasil tombol Cadangkan.");
  }
};

/* ---------- jam & sapaan ---------- */
function toast(s) {
  $("toast").textContent = s;
  $("toast").classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $("toast").classList.remove("show"), 2200);
}

function tick() {
  const d = new Date();
  $("clock").textContent = new Intl.DateTimeFormat("id-ID", { hour: "2-digit", minute: "2-digit", hour12: false }).format(d).replace(".", ":");
  $("date").textContent = new Intl.DateTimeFormat("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(d);
  const h = d.getHours();
  $("greeting").textContent = h < 11 ? "SELAMAT PAGI, BAYYU" : h < 15 ? "SELAMAT SIANG, BAYYU" : h < 18 ? "SELAMAT SORE, BAYYU" : "SELAMAT MALAM, BAYYU";
}

tick();
setInterval(tick, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
render();
checkMissingIcons();

// Versi satu file: bersihkan service worker & cache lama dari versi sebelumnya
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
}
if (window.caches) {
  caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
}

</script>
</body>
</html>
